name: Bug report
description: Report a reproducible product or documentation problem.
body:
  - type: markdown
    attributes:
      value: Use redacted or synthetic examples. Report security findings privately through the repository Security tab.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the affected feature and version or commit, if known.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Steps and environment
      description: Include the device, browser, or runtime when relevant.
    validations:
      required: true
